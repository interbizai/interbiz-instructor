<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>인터PICK — 조직 선택</title>
<link rel="icon" type="image/png" href="assets/logo/interpick-icon.png">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<div class="org-select-wrap">
  <div class="login-logo"><img src="assets/logo/interpick-logo.png" alt="인터PICK" onerror="this.src='assets/logo/인터비즈로고.png'"></div>
  <div class="org-select-title">소속 조직을 선택해주세요</div>
  <div class="org-select-sub">조직별 전용 로그인 페이지로 이동합니다</div>
  <div class="org-cards">
    <a class="org-card am" href="login-am.html">
      <div>
        <div class="name">가전AM</div>
        <div class="desc">가전AM 현장강사 · 관리자 로그인</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="org-card hicare" href="login-hicare.html">
      <div>
        <div class="name">하이케어솔루션</div>
        <div class="desc">하이케어솔루션 강사 · 관리자 로그인</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
  <div class="login-footer">ⓒ interbiz · 강사 역량 평가 시스템 인터PICK</div>
</div>
<script>
// 이미 로그인된 세션이 있으면 바로 앱으로
(function(){
  try{
    const t = localStorage.getItem('ib_token'), u = localStorage.getItem('ib_user');
    if(t && u){
      const part = t.split('.')[1];
      const pad = '='.repeat((4 - part.length % 4) % 4);
      const exp = (JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/') + pad)).exp || 0) * 1000;
      if(!exp || exp > Date.now()){ location.replace('index.html'); }
    }
  }catch(_){}
})();
</script>
</body>
</html>
