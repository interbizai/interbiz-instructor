<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LG전자 강사 로그인 — 인터PICK</title>
<link rel="icon" type="image/png" href="assets/logo/interpick-icon.png">
<link rel="stylesheet" href="assets/css/login.css?v=20260729">
</head>
<body class="org-am">
<div class="login-wrap">
  <div class="login-logo"><img src="assets/logo/interpick-logo.png" alt="인터PICK" onerror="this.src='assets/logo/인터비즈로고.png'"></div>
  <div class="login-card">
    <div class="org-badge"><span class="dot"></span>LG전자 강사 전용</div>
    <div class="login-title">LG전자 강사 로그인</div>
    <div class="login-sub">LG전자 강사 소속 강사·관리자만 로그인할 수 있습니다.</div>
    <div id="session-note" class="session-note"></div>
    <div class="form-group">
      <label class="form-lbl" for="li-email">아이디</label>
      <input type="text" class="form-input" id="li-email" placeholder="아이디 입력" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-lbl" for="li-pw">비밀번호</label>
      <div class="pw-wrap">
        <input type="password" class="form-input" id="li-pw" placeholder="비밀번호 입력" autocomplete="current-password">
        <button class="pw-toggle" type="button" id="li-pw-toggle" aria-label="비밀번호 표시">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div id="li-err" class="login-err"></div>
    <button class="btn-login" id="li-btn">로그인</button>
    <div class="login-note">하이케어솔루션 소속이신가요? <a href="login-hicare.html">하이케어 로그인</a></div>
  </div>
  <div class="login-footer">ⓒ interbiz · 강사 역량 평가 시스템 인터PICK</div>
</div>
<script>window.LOGIN_ORG='LG전자 강사';</script>
<script src="assets/js/login.js"></script>
</body>
</html>
